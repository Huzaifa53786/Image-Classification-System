[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classifier"
version = "1.0.0"
description = "Image classification API and CLI powered by a pretrained PyTorch model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=10.3,<13",
  "python-multipart>=0.0.20,<1",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
image-classifier = "image_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

